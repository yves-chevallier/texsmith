[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "texsmith"
dynamic = ["version"]
description = "A TMark (Markdown) to LaTeX and Typst converter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yves Chevallier", email = "yves.chevalier@heig-vd.ch" }
]
keywords = [
    "tmark",
    "markdown",
    "latex",
    "typst",
    "mkdocs",
    "convert"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # adapters/plugins/snippet.py rewrites a rendered HTML preview into a
    # captured-screenshot fallback with a real tree API (Tag.find/.get/
    # .get_text/.new_tag across several functions): more than the handful of
    # lines html.parser's SAX-style parser would take to reach parity.
    "beautifulsoup4>=4.14.2",
    "cairosvg>=2.8.2",
    "emoji>=2.12.1",
    "jinja2>=3.1.6",
    # site/nav.py resolves the documentation navigation the way
    # mkdocs-awesome-nav and MkDocs resolve it, and those two do it with these
    # three: wcmatch matches a nav pattern's globs, natsort orders its matches,
    # pathspec matches the gitignore lines of `exclude_docs`. The floors are
    # the ones `mkdocs-awesome-nav` (natsort, wcmatch) and `mkdocs` (pathspec)
    # declare, so a site whose environment has the plugins resolves through one
    # copy of each library rather than two.
    "natsort>=8.1.0",
    "pathspec>=0.11.1",
    "wcmatch>=8.4",
    "pillow>=12.0.0",
    "pint>=0.24",
    "pybtex>=0.24.0",
    "pydantic>=2.7.0",
    "pypdf>=6.1.1",
    "pygments>=2.18.0",
    # writers/latex/escaper.py's --legacy-latex-accents mode (ConversionRequest
    # .legacy_latex_accents, tested) leans on unicode_to_latex's full
    # Unicode -> LaTeX accent-macro table; reimplementing that table is not a
    # small function.
    "pylatexenc>=2.10",
    "pymupdf>=1.24.3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "tomli>=2.0.1; python_version < \"3.11\"",
    "playwright>=1.56.0",
    # Loaded dynamically by adapters/latex/pyxindy.py via importlib, not
    # imported directly: keep even though grep finds no `import pyxindy`.
    "pyxindy>=0.0.7",
    "requests>=2.32.5",
    # The TMark core (parser, IR, printer, registries, writers): the PyPI
    # project `tmark-core`, import name `tmark`. The IR models TeXSmith reads
    # ship in the wheel, so the minor version is part of the contract.
    "tmark-core>=0.3.2,<0.4",
]
[project.optional-dependencies]
typst = ["typst>=0.15"]

[project.urls]
Homepage = "https://github.com/yves-chevallier/texsmith"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/texsmith"]
include = ["src/texsmith/adapters/latex/xindy/*.xdy"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/build",
    "/examples",
    "/experiments",
    "/templates",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.uv-cache",
    "/build",
    "/examples",
    "/experiments",
    "/templates",
    "/mkdocs_latex"
]

[project.scripts]
texsmith = "texsmith.ui.cli.app:main"
check = "texsmith.devtools:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.1",
    "nox[pbs]>=2024.4.16",
    "pytest-cov>=7.0.0",
    "mkdocs-texsmith ; python_version >= \"3.10\"",
    # The examples Makefile builds the Typst variants: keep the embedded
    # compiler in the default dev sync so a plain `uv sync` doesn't drop it.
    "typst>=0.15",
]
docs = [
    "mkdocs-awesome-nav>=3.2.0",
    "mkdocs-material>=9.6.22",
    "mkdocstrings[python]>=0.21.2",
    "mkdocs-drawio @ git+https://github.com/yves-chevallier/mkdocs-drawio.git@testounet",
    "mkdocs-texsmith ; python_version >= \"3.10\"",
    "zensical>=0.0.62",
]


[tool.uv]
default-groups = ["dev", "docs"]
package = true

[tool.uv.workspace]
members = [
    "packages/mkdocs_texsmith",
]

[tool.uv.sources]
mkdocs-texsmith = { workspace = true }

[tool.pytest.ini_options]
addopts = []
testpaths = ["tests", "packages"]
norecursedirs = ["build*", ".claude", "examples"]

[tool.ruff]
line-length = 100
# Keep aligned with ``requires-python`` so version-guard polyfills (notably the
# Python 3.10 ``StrEnum`` shim in ``extensions/tables/constants.py``) are not
# flagged by UP036 as ``outdated version block``.
target-version = "py310"
extend-exclude = [
  "mkdocs_latex",
  ".venv",
  "venv",
  "build",
  "sandbox",
  "templates",
  "examples",
  "experiments",
  "dist",
  # The MkDocs and Zensical output at the repository root, not the
  # ``texsmith.site`` package.
  "/site",
  "docs/_build",
  "**/migrations",
]

fix = true
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = [
  "E","F","I","B","UP",
  "C90","N","D","ANN","C4","SIM","PTH","T20","ERA","ARG","G","TRY","DTZ","SLF","PT","RUF","A",
]
ignore = [
  "E501",  # line too long (handled by line-length)
  "F403",  # 'from module import *' used; unable to detect undefined names
  "D107",  # missing docstring in __init__
  "D202",  # No blank lines after function docstring
  "D203",  # 1 blank line required before class docstring
  "D212",  # Multi-line docstring summary should start at the first line
  "D214",  # Multi-line docstring summary should start and end on triple quotes
  "D100",  # missing docstring in public module
  "D101",  # missing docstring in public class
  "D102",  # missing docstring in public method
  "D103",  # missing docstring in public function
  "D104",  # missing docstring in public package
  "D105",  # missing docstring in magic method
  "D200",  # One-line docstring should fit on one line
  "D205",  # Blank line required between summary line and description
  "D301",  # Use raw string or escape the backslash
  "D415",  # First line of docstring should end with punctuation
  "ANN201",  # Missing return type annotation for public function
  "ARG002",  # Unused argument
  "B008",   # Function call in default argument (Typer pattern)
  "S101",    # Use of assert detected
  "TRY003",  # Catching too general exception Exception
  "ANN401",  # Missing type annotation for function argument
  "C901",  # Function is too complex
  "UP017",  # Date time issue with py310
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["texsmith"]
section-order = ["future","standard-library","third-party","first-party","local-folder"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/texsmith/cli.py" = ["B008"]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "T20", "S101", "ANN", "ARG002", "SLF001", "PT018", "ARG001", "TRY003"]
# Developer scripts report through the terminal.
"scripts/**" = ["T20"]
