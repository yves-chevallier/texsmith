# Parity allow-list (specs/migration/writers-and-passes.md §5).
#
# One entry per *intended* difference between the legacy (`html`) and the
# tmark reader outputs. `parity.py diff` applies them before reporting; an
# unlisted difference fails the run. Every entry names its owner reason and
# the release at which it expires (the loader refuses expired entries so the
# list is pruned as the allow-listed change ships).
#
# Kinds
#   rewrite  literal `from` → `to` substitution applied to BOTH sides before
#            diffing (a spelling change the writer makes on purpose)
#   hunk     a unified-diff hunk whose `-`/`+` lines match `pattern`
#            (re.MULTILINE, searched — anchor with \A…\Z to match the whole
#            hunk) is ignored; other hunks in the same file still count
#
# `files` are glob patterns matched against `<entry id>/<file name>`, e.g.
# `docs/syntax/tables/tables.tex`, `abbr@typst/abbreviations.typ`;
# `**` crosses directory boundaries, `*` does not.
#
# A rewrite whose `from` only the new writer emits (e.g. `\tsdivider`) is a
# one-sided spelling: the legacy text never contains it, so the substitution
# folds the new spelling onto the legacy one.
#
# The triage of 2026-09-12 (specs/migration/parity-triage.md) groups the
# entries below by section; the unlisted hunks that remain after this list
# are the findings of that note.

# ---------------------------------------------------------------- contracts
# fragment-contracts.md §1 / decisions.md X4: partial → contract macro names.

- id: horizontal-rule-tsdivider
  kind: rewrite
  files: ["**/*.tex"]
  from: '\tsdivider'
  to: '\clearpage'
  reason: "decisions.md X2: HorizontalRule → \\tsdivider contract; legacy emits \\clearpage"
  expires: 0.8.0
- id: horizontal-rule-tsdivider-typst
  kind: rewrite
  files: ["**/*.typ"]
  from: '#ts-divider()'
  to: '#line(length: 100%)'
  reason: "decisions.md X2: HorizontalRule → #ts-divider() contract; legacy emits #line"
  expires: 0.8.0
- id: item-braces
  kind: rewrite
  files: ["**/*.tex"]
  from: '\item{} '
  to: '\item '
  reason: "writers-and-passes.md §2 Lists: unordered_list.tex `\\item{}` artefact dropped"
  expires: 0.8.0
- id: code-inline
  kind: rewrite
  files: ["**/*.tex"]
  from: '\texttt{'
  to: '\tscodeinline{'
  reason: "fragment-contracts.md §1 codeinline: \\texttt → \\tscodeinline (ts-code)"
  expires: 0.8.0
- id: code-block-end
  kind: rewrite
  files: ["**/*.tex"]
  from: '\end{code}'
  to: '\end{tscode}'
  reason: "fragment-contracts.md §1 codeblock: code → tscode environment"
  expires: 0.8.0
- id: code-block-begin
  kind: hunk
