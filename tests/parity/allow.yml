# fragment-contracts.md §1 / decisions.md X4: `Span{script=slug}` was
# `\text<slug>{…}`, it is now `\tsscript{slug}{…}`. The macro name is folded
# onto the contract spelling here; what the rewrite leaves behind is the pass
# behaviour of writers-and-passes.md §3 decision R4 (a run is split at a soft
# break and a run next to a backslash is wrapped), allow-listed just below.
- id: script-japanese
  kind: rewrite
  files: ["**/*.tex"]
