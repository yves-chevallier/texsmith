  from: '\texsmithHighlight{'
  to: '\tsmark{'
  reason: "fragment-contracts.md §1 highlight: \\texsmithHighlight → \\tsmark (ts-typesetting)"
  expires: 0.8.0
- id: aside
  kind: rewrite
  files: ["**/*.tex"]
  from: '\marginnote{'
  to: '\tsaside{'
  reason: "fragment-contracts.md §1: Aside → \\tsaside (ts-typesetting)"
  expires: 0.8.0
- id: aside-side
  kind: hunk
  files: ["marginnote/*.tex", "docs/syntax/*/*.tex"]
  pattern: '\{\\reversemarginpar\\tsaside\{|\\tsaside\[side=(?:left|right)\]\{'
  reason: "fragment-contracts.md §1: `{\\reversemarginpar\\marginnote{…}}` → \\tsaside[side=left]{…}; an explicit `{r}` writes side=right"
  expires: 0.8.0
- id: task-list
  kind: rewrite
  files: ["**/*.tex"]
  from: '{todolist}'
  to: '{tstasklist}'
  reason: "fragment-contracts.md §1 choices: todolist → tstasklist (ts-todolist)"
  expires: 0.8.0
- id: task-done
