  from: '\texsmithEmoji{'
  to: '\tsemoji{'
  reason: "fragment-contracts.md §1 (emitted with no partial): font-mode emoji → \\tsemoji (ts-fonts)"
  expires: 0.8.0
- id: highlight
  kind: rewrite
