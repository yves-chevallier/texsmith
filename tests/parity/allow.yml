- id: progress-bar
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A(?:-(?:\{\\progressbar\[[^\]]*\]\{[\d.]+\} .*\}\\par)?\n)+(?:\+\\tsprogress(?:\[[a-z]+\])?\{[\d.]+\}\{.*\}(?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1: ProgressBar → \\tsprogress[thin]{0.45}{label} (ts-typesetting); the macro expands to the legacy \\progressbar line"
  expires: 0.8.0
- id: autolink-url
  kind: hunk
