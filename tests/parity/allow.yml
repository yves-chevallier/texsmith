# ------------------------------------------------------ writer behaviours
# writers-and-passes.md §2: intended behaviour changes of the LaTeX writer.
- id: pagestyle-dropped
  kind: rewrite
  files: ["**/*.tex"]
  from: "\\thispagestyle{plain}\n"
  to: ""
  reason: "fragment-contracts.md §1 pagestyle (X): the template emits \\thispagestyle after \\maketitle, the writer no longer does (one-sided: the tmark path never writes it)"
  expires: 0.8.0
# The tmark writer labels a heading only for an explicit `{#id}` or an implicit
# id a reference targets (latex/mod.rs header(); writers-and-passes.md §6 open
# question (b)); legacy labelled every heading with its slug. Decision D1 in
# parity-triage.md. The normaliser splits a sectioning command's trailing
# `\label{…}` onto its own line, so the heading itself matches and only the
# surplus label lines remain; a caption's label is never split, so losing a
# float label still shows up as a changed `\caption…` line.
- id: heading-label-implicit
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A(?:-\\label\{[^{}]*\}\n?)+\Z'
  reason: "tmark latex writer header(): implicit heading ids are not labelled unless referenced (parity-triage.md D1)"
  expires: 0.8.0
- id: index-zero-width
