# A legacy callout is three nested `#block(…)` lines plus a bold title line and
# one or two closing `]`; the tmark writer emits the `#ts-callout` contract.
# The body between them is unchanged, so the hunk is the envelope only.
- id: typst-callout-envelope
  kind: hunk
  files: ["**/*.typ"]
  pattern: '\A(?:-(?:#block\(width: 100%[^\n]*|#text\(weight: "bold"\)\[[^\n]*|\]+|)\n)+(?:\+(?:#ts-callout\((?:kind: "[a-z]+")(?:, title: \[[^\n]*\])?(?:, id: "[^"]*")?(?:, collapsed: true)?\)\[|\]+|)(?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1 callout (Typst): #ts-callout(kind:, title:)[…] replaces the per-instance #block/#text envelope the legacy writer inlined"
  expires: 0.8.0
# `#ts-code(…)[ ``` … ``` ]` wraps the fence when the block carries a title,
# line numbers or highlighted lines; the closing `]` rides on the closing fence.
- id: typst-code-wrapper
  kind: hunk
  files: ["**/*.typ"]
  pattern: '\A(?:-(?:```[a-zA-Z0-9_+-]*|)\n)*(?:\+(?:#ts-code\([^\n]*\)\[|```[a-zA-Z0-9_+-]*\]?|\]|)(?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1 codeblock (Typst): title/linenums/hl_lines wrap the raw fence in #ts-code(…)[…]; the legacy writer dropped those attributes and the fence language (legacy bug L1, parity-triage.md)"
  expires: 0.8.0
# Inline code that carries a language becomes `#raw(lang: "…", "…")` so Typst
# highlights it; the legacy writer emitted an unlabelled raw span.
- id: typst-raw-inline
  kind: hunk
  files: ["**/*.typ"]
  pattern: '\A(?:-[^\n]*\n)+(?:\+[^\n]*#raw\(lang: "[a-zA-Z0-9_+-]+", [^\n]*(?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1 codeinline (Typst): a fenced language becomes #raw(lang: …); the legacy span also swallowed the whitespace tokens (legacy bug L4, parity-triage.md)"
  expires: 0.8.0
# writers-and-passes.md §3 links pass: a link whose target is a local `.md`
# file has no meaning in a single-document render; the text stays, the target
# goes. Same rule as `snippet-link` on the LaTeX side.
- id: typst-link-local-md
  kind: hunk
  files: ["**/*.typ"]
  pattern: '\A(?:-[^\n]*#link\("[^"]*\.md(?:#[^"]*)?"\)\[[^\n]*\n)+(?:\+[^\n]*(?:\n|\Z))+\Z'
  reason: "writers-and-passes.md §3 links pass: a local .md target is dropped and the link text stays (open point O2, parity-triage.md)"
  expires: 0.8.0
# A document with `numbered: false` gets an explicit `#heading(…)` call instead
# of the `=` shorthand, so the writer can spell `numbering: none`.
- id: typst-heading-unnumbered
  kind: hunk
  files: ["**/*.typ"]
  pattern: '\A(?:-=+ [^\n]*\n)+(?:\+#heading\(level: \d+, numbering: none, outlined: false\)\[[^\n]*\](?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1 heading (Typst): `numbered: false` is spelled on the heading call; `outlined: false` is open point O3 (parity-triage.md)"
  expires: 0.8.0
- id: typst-tabbed
