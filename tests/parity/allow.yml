  pattern: '\A-\\begin\{code\}\{([^}]*)\}\{[^}]*\}\{[^}]*\}\n\+\\begin\{tscode\}\[lang=\1(?:, (?:title=\{.*\}|linenums|stretch=[\d.]+|hl_lines=\{[^}]*\}|id=[^,\]]+))*, engine=pygments\]\Z'
  reason: "fragment-contracts.md §1 codeblock: \\begin{code}{lang}{title}{opts} → \\begin{tscode}[lang=, title=, linenums, hl_lines=, stretch=, engine=pygments] (decisions.md X3)"
  expires: 0.8.0
