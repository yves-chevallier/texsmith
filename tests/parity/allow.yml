  from: '\item[\done]'
  to: '\item[\tsdone]'
  reason: "fragment-contracts.md §1 choices: \\item[\\done] → \\item[\\tsdone]"
  expires: 0.8.0
- id: progress-bar
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A(?:-\{\\progressbar\[[^\]]*\]\{[\d.]+\} .*\}\\par\n)+(?:\+\\tsprogress(?:\[[a-z]+\])?\{[\d.]+\}\{.*\}(?:\n|\Z))+\Z'
  reason: "fragment-contracts.md §1: ProgressBar → \\tsprogress[thin]{0.45}{label} (ts-typesetting); the macro expands to the legacy \\progressbar line"
  expires: 0.8.0
- id: autolink-url
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A-(.*)\\href\{([^{}]*)\}\{\2\}(.*)\n\+\1\\url\{\2\}\3\Z'
  reason: "fragment-contracts.md §1 href, url: a bare autolink renders \\url{url}; legacy \\href{url}{url}"
  expires: 0.8.0
- id: tabbed-tsdiv
  kind: hunk
  files: ["docs/guide/**/*.tex"]
  pattern: '\\(?:begin|end)\{tsdiv\}'
  reason: "fragment-contracts.md §1 tabbed: `=== \"Title\"` → \\begin{tsdiv}{tab}[title={…}]; legacy printed \\textbf{Title}\\par"
  expires: 0.8.0

