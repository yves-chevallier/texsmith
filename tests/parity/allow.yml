# ------------------------------------------------------ writer behaviours
# writers-and-passes.md §2: intended behaviour changes of the LaTeX writer.
- id: pagestyle-dropped
  kind: rewrite
  files: ["**/*.tex"]
  from: "\\thispagestyle{plain}\n"
  to: ""
  reason: "fragment-contracts.md §1 pagestyle (X): the template emits \\thispagestyle after \\maketitle, the writer no longer does (one-sided: the tmark path never writes it)"
  expires: 0.8.0
# The tmark writer labels a heading only for an explicit `{#id}` or an implicit
# id a reference targets (latex/mod.rs header(); writers-and-passes.md §6 open
# question (b)); legacy labelled every heading with its slug. Decision D1 in
# parity-triage.md. A zero-context hunk merges a heading with the changed line
# that follows it, hence the combined forms.
- id: heading-label-implicit
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n\+\\\1\2\{\3\}\Z'
  reason: "tmark latex writer header(): implicit heading ids are not labelled unless referenced (parity-triage.md D1)"
  expires: 0.8.0
- id: heading-label-implicit-pair
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n\+\\\1\2\{\3\}\n\+\\\4\5\{\6\}\Z'
  reason: "tmark latex writer header(): two adjacent headings (parity-triage.md D1)"
  expires: 0.8.0
- id: heading-label-implicit-code
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n-\\begin\{code\}\{([^}]*)\}\{[^}]*\}\{[^}]*\}\n\+\\\1\2\{\3\}\n\+\\begin\{tscode\}\[lang=(?:\4|\w+)(?:, (?:title=\{.*\}|linenums|stretch=[\d.]+|hl_lines=\{[^}]*\}|id=[^,\]]+))*, engine=pygments\]\Z'
  reason: "tmark latex writer header() + fragment-contracts.md §1 codeblock: a heading directly followed by a fence (parity-triage.md D1)"
  expires: 0.8.0
- id: heading-label-implicit-pair-code
  kind: hunk
  files: ["**/*.tex"]
  pattern: '\A-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n-\\((?:sub)*section|paragraph|subparagraph|chapter|part)(\*?)\{(.*)\}\\label\{[^}]*\}\n-\\begin\{code\}\{([^}]*)\}\{[^}]*\}\{[^}]*\}\n\+\\\1\2\{\3\}\n\+\\\4\5\{\6\}\n\+\\begin\{tscode\}\[lang=(?:\7|\w+)(?:, (?:title=\{.*\}|linenums|stretch=[\d.]+|hl_lines=\{[^}]*\}|id=[^,\]]+))*, engine=pygments\]\Z'
  reason: "tmark latex writer header() + fragment-contracts.md §1 codeblock: two headings then a fence (parity-triage.md D1)"
